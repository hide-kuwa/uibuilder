name: legacy-guard
on: [pull_request]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if git diff --name-only origin/${{ github.base_ref }}... | grep -E '^apps/legacy-builder/'; then
            echo "legacy is read-only"; exit 1
          fi
